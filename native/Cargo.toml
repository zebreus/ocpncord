[package]
name = "ocpncord-native"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ocpncord-native"
path = "src/main.rs"

[dependencies]
ocpncord-types.workspace = true
ocpncord-backend = { path = "../backend" }
ocpncord-backend-opencode = { path = "../backend-opencode" }
ocpncord-tui = { path = "../tui" }
log = "0.4"
ratatui-core = { workspace = true, features = ["std"] }
crossterm = "0.28"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
embedded-nal-async = "0.9"
embedded-io-async = { version = "0.7", features = ["std"] }
