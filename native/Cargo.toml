[package]
name = "ocpncord-native"
description = "Native desktop binary for the ocpncord opencode TUI client."
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["ocpncord", "opencode", "terminal", "tui", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ocpncord-native"
path = "src/main.rs"

[dependencies]
ocpncord-backend.workspace = true
ocpncord-backend-opencode.workspace = true
ocpncord-tui.workspace = true
log = { workspace = true, features = ["std"] }
ratatui-core = { workspace = true, features = ["std"] }
crossterm.workspace = true
tokio.workspace = true
futures = { workspace = true, features = ["std"] }
clap.workspace = true
embedded-nal-async.workspace = true
embedded-io-async = { workspace = true, features = ["std"] }
