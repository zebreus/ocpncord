[package]
name = "ocpncord-backend-opencode"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ocpncord-types.workspace = true
ocpncord-backend = { path = "../backend" }
futures-core.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwless = { version = "0.14", default-features = false }
embedded-io-async = "0.7"
embedded-nal-async = "0.9"

[dev-dependencies]
futures.workspace = true
embedded-nal-async = "0.9"
embedded-io-async = { version = "0.7", features = ["std"] }

[dev-dependencies.tokio]
version = "1"
features = ["macros", "rt-multi-thread", "time", "net", "io-util"]
