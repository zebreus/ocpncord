[package]
name = "ocpncord-tui"
description = "Platform-agnostic no_std Ratatui UI for ocpncord."
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["ocpncord", "opencode", "ratatui", "tui", "no-std"]
categories = ["command-line-interface", "embedded", "no-std"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
log.workspace = true
ocpncord-types.workspace = true
ocpncord-backend = { workspace = true, features = ["mock"] }
ratatui-core.workspace = true
ratatui.workspace = true
futures-core.workspace = true
futures.workspace = true

[dev-dependencies]
futures = { workspace = true, features = ["executor", "std"] }
