[workspace]
resolver = "2"
members = ["backend", "backend-opencode", "tui", "native"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/zebreus/ocpncord"
rust-version = "1.91.0"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
embedded-io-async = "0.7"
embedded-nal-async = "0.9"
futures = { version = "0.3", default-features = false, features = ["alloc"] }
futures-core = { version = "0.3", default-features = false, features = [
    "alloc",
] }
log = { version = "0.4", default-features = false }
ocpncord-backend = { version = "0.5.0", path = "backend" }
ocpncord-backend-opencode = { version = "0.5.0", path = "backend-opencode" }
ocpncord-tui = { version = "0.5.0", path = "tui" }
ratatui = { version = "0.30", default-features = false }
ratatui-core = { version = "0.1", default-features = false }
# `embedded-tls` (pulled in by reqwless's `embedded-tls` feature) provides the
# TLS 1.3 stack used for `https://`. embedded-tls 0.18.0 was built against a
# `der 0.8.0-rc.*` pre-release; the now-stable `der 0.8.0` moved items it uses
# behind features and changed derives, so `der` must resolve to `0.8.0-rc.10`
# (the rc current when embedded-tls 0.18.0 shipped). That constraint is enforced
# for downstream consumers by an explicit `der` pin in backend-opencode (a
# lockfile pin alone would not reach them).
reqwless = { version = "0.14", default-features = false, features = [
    "embedded-tls",
    "alloc",
] }
serde = { version = "1", default-features = false, features = [
    "derive",
    "alloc",
] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "sync",
    "net",
    "io-util",
] }
